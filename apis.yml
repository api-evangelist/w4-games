aid: w4-games
name: W4 Games
description: >-
  W4 Games is the company commercializing the open-source Godot game engine. It
  provides hands-on professional services (adoption, architecture, performance,
  production readiness), advanced console ports and mobile/XR platform work, and
  premium enterprise support for studios shipping with Godot. Its developer
  product is W4 Cloud (W4GD) — a managed multiplayer backend-as-a-service for
  Godot covering player authentication, a Supabase/PostgREST database accessed
  through the W4 Relational Mapper (W4RM) ORM, realtime, storage, matchmaking and
  lobbies, WebRTC, analytics, and Agones-based dedicated game-server fleets. W4
  Cloud is consumed through the w4gd Godot editor addon (GDScript SDK) rather than
  a standalone public REST API. Backed by Lux Capital.
