apis:
- name: W4 Cloud
  description: >-
    W4 Cloud (W4GD) is a managed multiplayer backend-as-a-service for the Godot
    game engine, consumed through the w4gd Godot editor addon (a GDScript SDK).
    It provides player authentication, a Supabase/PostgREST-backed database
    exposed through the W4 Relational Mapper (W4RM) ORM, realtime subscriptions,
    file storage, matchmaking and lobbies, WebRTC networking, analytics, and
    Agones-based dedicated game-server fleet management.
